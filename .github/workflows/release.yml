# Publishes a GitHub Release when a version tag is pushed:
#   1. raise "version" in manifest.json (for example to 1.0.1) and merge that to main
#   2. optionally write release-notes/v1.0.1.md (otherwise GitHub generates the notes)
#   3. git tag v1.0.1 && git push origin v1.0.1
# The package is built from the tagged commit with tools/build-release.sh and attached to the release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the tag matches the manifest version
        run: |
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' manifest.json | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in manifest.json"
            exit 1
          fi

      - name: Syntax check
        run: for f in *.js lib/*.js; do node --check "$f"; done

      - name: Build the package
        run: ./tools/build-release.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "releases/KBMax-Backup-$GITHUB_REF_NAME.zip" \
            --title "KBMax Backup ${GITHUB_REF_NAME#v}" "${notes_args[@]}"
