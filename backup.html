<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KBMax Backup - progress</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .wrap { max-width: 760px; margin: 0 auto; }
    progress { width: 100%; height: 14px; accent-color: var(--brand); }
    #log { font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; max-height: 320px; overflow-y: auto; background: #0f1b29; color: #d7e3f0; padding: 8px 10px; border-radius: var(--radius); }
    #log .err { color: #ff9b94; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: 3px 0; }
    td:last-child { text-align: right; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="app-header">
      <img src="icons/icon_32x32.png" alt="" />
      <h1>KBMax Backup</h1>
      <span id="envBadge" class="badge none">-</span>
    </div>

    <div class="panel">
      <h2 id="stepTitle">Preparing</h2>
      <progress id="progress" max="100" value="0"></progress>
      <div id="status" class="muted"></div>
      <div class="row">
        <button id="cancelButton" class="secondary">Cancel</button>
        <button id="downloadButton" hidden>Download ZIP</button>
        <button id="againButton" class="secondary" hidden>Run backup again</button>
      </div>
    </div>

    <div class="panel" id="summaryPanel" hidden>
      <h2>Result</h2>
      <table id="summary"></table>
    </div>

    <div class="panel">
      <h2>Log</h2>
      <div id="log"></div>
    </div>
  </div>

  <script src="boot.js"></script>
  <script type="module" src="backup.js"></script>
</body>
</html>
